<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#d71920"><title>YouTuber Simulator</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent} :root{--red:#e31b23;--red2:#ff424a;--dark:#090b12;--panel:#111521;--panel2:#181d2b;--text:#fff;--muted:#9da5b7;--gold:#ffd43b} body{margin:0;background:#07080c;color:#fff;font-family:Arial,Helvetica,sans-serif;overflow:hidden}button,input,textarea{font:inherit}button{cursor:pointer;border:0;color:#fff}.hidden{display:none!important}
#loading{position:fixed;inset:0;background:#08090d;z-index:99;display:flex;align-items:center;justify-content:center;flex-direction:column}.logo{font-weight:1000;font-size:clamp(32px,9vw,70px);letter-spacing:-3px;text-align:center}.logo span{color:var(--red)}.loadbox{width:min(520px,82vw);height:18px;background:#262b37;border:2px solid #3b4250;border-radius:12px;overflow:hidden;margin-top:24px}.loadbox div{height:100%;width:0;background:linear-gradient(90deg,#b90f16,#ff4048)}#loadtxt{margin-top:10px;color:#aeb6c7;font-weight:700}
#app{height:100vh;display:none;position:relative}#scene{position:absolute;inset:0 0 76px 0;background:#151822;overflow:hidden}#room,#sceneBg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center}#character{position:absolute;height:72%;max-height:760px;width:auto;left:50%;bottom:1%;transform:translateX(-50%);object-fit:contain;filter:drop-shadow(0 12px 8px rgba(0,0,0,.45));user-select:none;touch-action:manipulation}#stats{position:absolute;left:12px;right:12px;top:12px;display:flex;gap:8px;flex-wrap:wrap;pointer-events:none}.stat{background:rgba(8,10,16,.88);border:1px solid #343b4a;border-radius:12px;padding:8px 11px;font-weight:800;box-shadow:0 5px 20px #0007}.stat small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase}#toast{position:absolute;top:75px;left:50%;transform:translateX(-50%) translateY(-15px);opacity:0;background:#101522;border:1px solid #3b4252;padding:10px 14px;border-radius:12px;font-weight:800;transition:.25s;z-index:20;pointer-events:none}#toast.show{opacity:1;transform:translateX(-50%)}
#nav{position:absolute;bottom:0;left:0;right:0;height:76px;background:#0c0f17;border-top:1px solid #303646;display:flex;overflow-x:auto;z-index:30}.navbtn{min-width:88px;background:transparent;color:#9da5b7;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:800}.navbtn b{font-size:21px}.navbtn.active{color:#fff;background:linear-gradient(#171c28,#0f121b)}.navbtn.active b{color:var(--red2)}
.modal{position:fixed;inset:0;background:#0009;z-index:60;display:none;align-items:flex-end;justify-content:center}.modal.open{display:flex}.sheet{width:min(800px,100%);max-height:92vh;overflow:auto;background:#0e121c;border:1px solid #303746;border-radius:20px 20px 0 0;padding:18px}.close{float:right;background:#252b39;border-radius:10px;padding:8px 12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{background:#171c28;border:1px solid #303747;border-radius:14px;padding:13px}.card h3{margin:0 0 6px;font-size:16px}.card p{margin:4px 0;color:var(--muted);font-size:13px}.primary{background:linear-gradient(135deg,#c9141b,#ff3c43);border-radius:11px;padding:10px 13px;font-weight:900}.secondary{background:#272e3d;border-radius:11px;padding:10px 13px;font-weight:800}.danger{background:#7e171b;border-radius:11px;padding:10px 13px;font-weight:900}input,textarea{width:100%;background:#080b12;color:#fff;border:1px solid #3a4151;border-radius:10px;padding:11px;outline:none}textarea{min-height:90px;resize:vertical}label{display:block;color:#c4cad6;font-size:12px;font-weight:800;margin:10px 0 6px}.row{display:flex;gap:9px;align-items:center}.row>*{flex:1}.progress{height:15px;background:#282e3a;border-radius:10px;overflow:hidden}.progress>div{height:100%;background:linear-gradient(90deg,#d3131a,#ff4148);width:0}.video-item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #2a3040}.thumb{width:100px;height:56px;object-fit:cover;border-radius:8px;background:#242a38}.achievement{display:flex;align-items:center;gap:12px}.badge{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:#272e3b;font-size:25px;filter:grayscale(1)}.unlocked .badge{filter:none;background:#322b0a}.muted{color:var(--muted)}
.preview{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:12px;background:#080b12;border:1px solid #343b4a}.carCard{text-align:center}.carCard img{width:100%;max-height:130px;object-fit:contain}.owned{border-color:#28c76f}.price{color:#61e58b;font-weight:900}.backStreet{position:absolute;top:12px;left:12px;z-index:15;background:#111722dd;border:1px solid #3b4351;border-radius:12px;padding:10px 14px;font-weight:900}.locationTitle{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:#111722dd;border:1px solid #3b4351;border-radius:12px;padding:10px 15px;font-weight:900;z-index:15}
#raceModal{position:fixed;inset:0;background:#000;z-index:100;display:none}#raceModal.open{display:block}.raceWorld{position:absolute;inset:0;background:url('race.png') center/cover no-repeat;overflow:hidden}.raceWorld:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 65%,#0005);pointer-events:none}.raceCar{position:absolute;width:180px;height:105px;object-fit:contain;left:50%;bottom:18%;transform:translateX(-50%);z-index:4;filter:drop-shadow(0 8px 4px #0009)}.raceTop{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;z-index:10}.raceStat{background:#101521dd;border:1px solid #3a4352;border-radius:12px;padding:9px 13px;font-weight:900}.raceBack{background:#111722dd;border:1px solid #3b4351;border-radius:12px;padding:9px 13px;font-weight:900}.raceControls{position:absolute;left:0;right:0;bottom:14px;display:flex;justify-content:center;gap:12px;z-index:10}.raceBtn{min-width:110px;height:72px;border-radius:16px;border:2px solid #333a47;background:#121722e8;font-weight:1000;font-size:17px}.raceBtn.gas{background:#198d43e8}.raceBtn.brake{background:#b92d32e8}.raceBtn.steer{min-width:72px;font-size:25px}
@media(max-width:520px){#character{height:67%;bottom:3%}.grid{grid-template-columns:1fr}.stat{padding:7px 9px}.stat small{font-size:9px}.raceBtn{min-width:95px;height:66px}.raceCar{width:150px}}
</style></head><body>
<div id="loading"><div class="logo">You<span>Tuber</span><br>SIMULATOR</div><div class="loadbox"><div id="loadbar"></div></div><div id="loadtxt">Завантаження 0%</div></div>
<div id="app"><div id="scene"><img id="sceneBg" src="room.png"><img id="character" src="character.png"><div id="stats"><div class="stat"><small>Долари</small>💵 <span id="money">0</span></div><div class="stat"><small>Підписники</small>👥 <span id="subs">0</span></div><div class="stat"><small>Перегляди</small>👁️ <span id="views">0</span></div><div class="stat"><small>За клік</small>⚡ +<span id="clickPower">1</span></div></div><div id="toast"></div></div>
<nav id="nav"><button class="navbtn active" data-open="home"><b>🏠</b>Головна</button><button class="navbtn" data-open="videos"><b>🎬</b>Відео</button><button class="navbtn" data-open="upgrades"><b>⬆️</b>Апгрейди</button><button class="navbtn" data-open="achievements"><b>🏆</b>Досягнення</button><button class="navbtn" data-open="profile"><b>👤</b>Профіль</button><button class="navbtn" data-open="street"><b>🏙️</b>Вулиця</button><button class="navbtn" data-open="garage"><b>🚗</b>Машини</button><button class="navbtn" data-open="settings"><b>⚙️</b>Налаштування</button></nav></div>
<div id="modal" class="modal"><div class="sheet" id="sheet"></div></div><div id="raceModal"><div class="raceWorld"><div class="raceTop"><button class="raceBack" onclick="exitDrive()">← Гараж</button><div class="raceStat">🏁 <span id="speed">0</span> км/год</div></div><img id="raceCar" class="raceCar" src="car1.png"><div class="raceControls"><button class="raceBtn steer" id="leftBtn">←</button><button class="raceBtn brake" id="brakeBtn">ТОРМОЗ</button><button class="raceBtn gas" id="gasBtn">ГАЗ</button><button class="raceBtn steer" id="rightBtn">→</button></div></div></div>
<script>
const $=id=>document.getElementById(id),fmt=n=>new Intl.NumberFormat('uk-UA',{notation:'compact',maximumFractionDigits:2}).format(n),exact=n=>new Intl.NumberFormat('uk-UA').format(Math.floor(n)),SAVE='ytSimSaveV2';
let state={money:0,subs:0,views:0,clickPower:1,upgrades:{click:0,views:0,subs:0,video:0},channel:'My YouTube Channel',avatar:'',videos:[],unlocked:[],ownedCars:[],selectedCar:0};
const cars=[{name:'Hatchback',price:200000,img:'car1.png',max:140},{name:'Sport Coupe',price:500000,img:'car2.png',max:180},{name:'Muscle Car',price:1000000,img:'car3.png',max:210},{name:'Supercar',price:3000000,img:'car4.png',max:270},{name:'Hypercar',price:6000000,img:'car5.png',max:330},{name:'Legend',price:10000000,img:'car6.png',max:390}];
function save(){localStorage.setItem(SAVE,JSON.stringify(state))}function load(){try{let x=JSON.parse(localStorage.getItem(SAVE));if(x)state={...state,...x,upgrades:{...state.upgrades,...x.upgrades},ownedCars:x.ownedCars||[]}}catch(e){}}function update(){$('money').textContent=exact(state.money);$('subs').textContent=fmt(state.subs);$('views').textContent=fmt(state.views);$('clickPower').textContent=fmt(state.clickPower);save()}function toast(t){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>$('toast').classList.remove('show'),1800)}function addMoney(n){state.money+=n;update()}
$('character').addEventListener('pointerdown',()=>{addMoney(state.clickPower);if(navigator.vibrate)navigator.vibrate(8)});
function openModal(title,html){$('sheet').innerHTML='<button class="close" onclick="closeModal()">✕</button><h2>'+title+'</h2>'+html;$('modal').classList.add('open')}function closeModal(){$('modal').classList.remove('open')}$('modal').addEventListener('pointerdown',e=>{if(e.target.id==='modal')closeModal()});
function setNav(name){document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.open===name))}
document.querySelectorAll('.navbtn').forEach(b=>b.onclick=()=>{setNav(b.dataset.open);let x=b.dataset.open;if(x==='home'){closeModal();showHome()}if(x==='videos')videos();if(x==='upgrades')upgrades();if(x==='achievements')achievements();if(x==='profile')profile();if(x==='street')street();if(x==='garage')garage();if(x==='settings')settings()});
function showHome(){ $('sceneBg').src='room.png'; $('character').style.display='block'; $('scene').querySelector('.backStreet')?.remove();$('scene').querySelector('.locationTitle')?.remove() }
function street(){closeModal();$('sceneBg').src='wide_pixel_art_outdoor_scene_of_a_suburban_vlogger.png';$('character').style.display='block';if(!$('scene').querySelector('.backStreet')){$('scene').insertAdjacentHTML('beforeend','<button class="backStreet" onclick="goHome()">← Назад</button><div class="locationTitle">🏙️ ВУЛИЦЯ · ЗНІМАЙ ВІДЕО</div>')}}
function goHome(){setNav('home');showHome();toast('Повернулися в кімнату')}
function videos(){openModal('🎬 Відео',`<div class="card"><h3>Опублікувати нове відео</h3><label>Назва <span style="color:#ff5b63">*</span></label><input id="vtitle" placeholder="Наприклад: Я купив нову машину!"><label>Опис</label><textarea id="vdesc" placeholder="Про що це відео?"></textarea><label>Прев’ю · фото автоматично стане 16:9</label><input id="vthumb" type="file" accept="image/*" onchange="makeThumb(this)"><img id="thumbPreview" class="preview hidden"><canvas id="thumbCanvas" class="hidden"></canvas><div style="height:10px"></div><button class="primary" onclick="startVideo()">🎥 Створити відео</button><p class="muted">Після створення потрібно зробити 400 кліків. Без назви відео створити не можна.</p></div><h3 style="margin-top:18px">📚 Історія відео</h3><div id="history">${historyHtml()}</div>`)}
function historyHtml(){if(!state.videos.length)return'<p class="muted">Тут з’являться твої відео.</p>';return state.videos.slice().reverse().map(v=>`<div class="video-item">${v.thumb?`<img class="thumb" src="${v.thumb}">`:'<div class="thumb"></div>'}<div><b>${esc(v.title)}</b><p>👁️ ${fmt(v.views)} · 👥 +${fmt(v.subs)} · 💵 +$${exact(v.money)}</p><small class="muted">${esc(v.desc||'Без опису')}</small></div></div>`).join('')}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function makeThumb(input){const f=input.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{const im=new Image();im.onload=()=>{const c=$('thumbCanvas'),ctx=c.getContext('2d'),tw=640,th=360;c.width=tw;c.height=th;let scale=Math.max(tw/im.width,th/im.height),w=im.width*scale,h=im.height*scale,x=(tw-w)/2,y=(th-h)/2;ctx.drawImage(im,x,y,w,h);$('thumbPreview').src=c.toDataURL('image/jpeg',.82);$('thumbPreview').classList.remove('hidden')};im.src=e.target.result};r.readAsDataURL(f)}
function startVideo(){const title=$('vtitle').value.trim();if(!title){toast('❌ Введи назву відео!');$('vtitle').focus();return}const desc=$('vdesc').value.trim();const thumb=$('thumbPreview').src||'';let clicks=0;openModal('🎬 Монтаж відео',`<div class="card"><h3>Готуємо «${esc(title)}»</h3><p>Клікай по ютуберу: <b><span id="vc">0</span>/400</b></p><div class="progress"><div id="vp"></div></div><button class="primary" style="width:100%;margin-top:14px;font-size:18px" id="vclick">📹 КЛІК!</button></div>`);$('vclick').onclick=()=>{clicks++;$('vc').textContent=clicks;$('vp').style.width=(clicks/4)+'%';if(clicks>=400){$('vclick').disabled=true;setTimeout(()=>finishVideo(title,desc,thumb),200)}}}
function finishVideo(title,desc,thumb){let views=Math.floor(1000*Math.pow(10,Math.random()*4));let subs=Math.floor(20+Math.pow(Math.random(),1.7)*980);views=Math.floor(views*(1+state.upgrades.views*.10));subs=Math.floor(subs*(1+state.upgrades.subs*.10));let money=Math.floor((30+Math.sqrt(views)*2.2)*(1+state.upgrades.video*.15));state.views+=views;state.subs+=subs;state.money+=money;state.videos.push({id:Date.now(),title,desc,thumb,views,subs,money});update();toast(`Відео опубліковано! +${fmt(subs)} підписників`);videos()}
function upgrades(){const u=state.upgrades,data=[['click','⚡ Прибуток за клік',u.click,100,`+$${u.click+1} до сили кліку`],['views','👁️ Перегляди',u.views,500,'+10% до переглядів відео'],['subs','👥 Підписники',u.subs,750,'+10% до підписників'],['video','💵 Долари за відео',u.video,1000,'+15% до нагороди за відео']];openModal('⬆️ Апгрейди',`<div class="grid">${data.map(d=>{let cost=Math.floor(d[3]*Math.pow(1.65,d[2]));return`<div class="card"><h3>${d[1]}</h3><p>Рівень: ${d[2]}</p><p>${d[4]}</p><button class="primary" onclick="buyUpgrade('${d[0]}',${cost})">💵 $${exact(cost)}</button></div>`}).join('')}</div>`)}function buyUpgrade(type,cost){if(state.money<cost){toast('Не вистачає доларів 😕');return}state.money-=cost;state.upgrades[type]++;if(type==='click')state.clickPower++;update();toast('Апгрейд придбано!');upgrades()}
const ach=[[1000,'🥉','Бронзова кнопка'],[100000,'🥈','Срібна кнопка'],[1000000,'🥇','Золота кнопка'],[10000000,'💎','Діамантова кнопка'],[100000000,'💠','Рубінова кнопка'],[1000000000,'👑','Легендарна кнопка']];function achievements(){openModal('🏆 Досягнення',ach.map(a=>{let ok=state.subs>=a[0];return`<div class="card achievement ${ok?'unlocked':''}" style="margin-bottom:10px"><div class="badge">${a[1]}</div><div><b>${a[2]}</b><p>${fmt(a[0])} підписників · ${ok?'РОЗБЛОКОВАНО 🔥':'🔒 Заблоковано'}</p></div></div>`}).join(''))}
function profile(){openModal('👤 Профіль',`<div class="card"><div class="row"><div style="width:80px;flex:0 0 80px;text-align:center">${state.avatar?`<img src="${state.avatar}" style="width:76px;height:76px;border-radius:50%;object-fit:cover">`:'<div style="font-size:55px">👤</div>'}</div><div><h3 style="margin:0">${esc(state.channel)}</h3><p>Твій канал</p></div></div><label>Назва каналу</label><input id="channel" value="${esc(state.channel)}"><label>Аватарка</label><input id="avatarFile" type="file" accept="image/*"><button class="primary" style="margin-top:10px" onclick="saveProfile()">💾 Зберегти профіль</button></div><div class="grid" style="margin-top:12px"><div class="card"><h3>👥 Підписники</h3><p>${exact(state.subs)}</p></div><div class="card"><h3>👁️ Перегляди</h3><p>${exact(state.views)}</p></div><div class="card"><h3>💵 Долари</h3><p>$${exact(state.money)}</p></div><div class="card"><h3>🎬 Відео</h3><p>${state.videos.length}</p></div></div>`)}function saveProfile(){state.channel=$('channel').value.trim()||'My YouTube Channel';const f=$('avatarFile').files[0];if(f){const r=new FileReader();r.onload=()=>{state.avatar=r.result;update();profile()};r.readAsDataURL(f)}else{update();profile()}}
function garage(){openModal('🚗 Машини · Гараж',`<div class="card"><p>Купуй машини за долари, обирай свою та натискай <b>DRIVE</b>, щоб виїхати на трасу.</p></div><div class="grid" style="margin-top:10px">${cars.map((c,i)=>{let own=state.ownedCars.includes(i);return`<div class="card carCard ${own?'owned':''}"><h3>${c.name}</h3><img src="${c.img}"><p class="price">$${exact(c.price)}</p>${own?`<button class="primary" onclick="selectCar(${i})">${state.selectedCar===i?'✅ Обрано':'Вибрати'}</button>`:`<button class="primary" onclick="buyCar(${i})">💵 Купити</button>`}</div>`}).join('')}</div><div class="card" style="margin-top:10px"><b>Обрана машина:</b> ${cars[state.selectedCar].name}<button class="primary" style="width:100%;margin-top:10px" ${state.ownedCars.includes(state.selectedCar)?'':'disabled'} onclick="drive()">🏁 DRIVE · ЇХАТИ</button></div>`)}
function buyCar(i){const c=cars[i];if(state.money<c.price){toast('Не вистачає доларів на цю машину 😕');return}state.money-=c.price;state.ownedCars.push(i);state.selectedCar=i;update();toast(`🚗 ${c.name} куплено!`);garage()}function selectCar(i){if(!state.ownedCars.includes(i))return;state.selectedCar=i;save();garage()}
let race={speed:0,x:50,gas:false,brake:false,left:false,right:false,raf:null};function drive(){if(!state.ownedCars.includes(state.selectedCar)){toast('Спочатку купи машину');return}closeModal();$('raceCar').src=cars[state.selectedCar].img;$('raceModal').classList.add('open');race.speed=0;race.x=50;updateRace();cancelAnimationFrame(race.raf);raceLoop()}function exitDrive(){cancelAnimationFrame(race.raf);$('raceModal').classList.remove('open');setNav('garage');garage()}function raceLoop(){if(!$('raceModal').classList.contains('open'))return;if(race.gas)race.speed=Math.min(cars[state.selectedCar].max,race.speed+1.8);else race.speed=Math.max(0,race.speed-.45);if(race.brake)race.speed=Math.max(0,race.speed-3);if(race.left)race.x=Math.max(27,race.x-0.9);if(race.right)race.x=Math.min(73,race.x+0.9);$('raceCar').style.left=race.x+'%';$('raceCar').style.transform='translateX(-50%) rotate('+(race.left?-5:race.right?5:0)+'deg)';$('raceWorld').style.backgroundPosition='center '+((Date.now()/10*race.speed)%500)+'px';updateRace();race.raf=requestAnimationFrame(raceLoop)}function updateRace(){$('speed').textContent=Math.round(race.speed)}
function hold(id,key){const el=$(id);el.addEventListener('pointerdown',e=>{e.preventDefault();race[key]=true});['pointerup','pointercancel','pointerleave'].forEach(ev=>el.addEventListener(ev,()=>race[key]=false))}hold('gasBtn','gas');hold('brakeBtn','brake');hold('leftBtn','left');hold('rightBtn','right');document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')race.left=true;if(e.key==='ArrowRight')race.right=true;if(e.key==='ArrowUp'||e.key===' ')race.gas=true;if(e.key==='ArrowDown')race.brake=true});document.addEventListener('keyup',e=>{if(e.key==='ArrowLeft')race.left=false;if(e.key==='ArrowRight')race.right=false;if(e.key==='ArrowUp'||e.key===' ')race.gas=false;if(e.key==='ArrowDown')race.brake=false});
function settings(){openModal('⚙️ Налаштування',`<div class="card"><h3>💾 Збереження</h3><p>Прогрес автоматично зберігається у пам’яті браузера після кожної дії.</p><button class="secondary" onclick="save();toast('Прогрес збережено!')">💾 Зберегти зараз</button></div><div class="card" style="margin-top:10px"><h3>🗑️ Скинути прогрес</h3><p>Буде видалено гроші, відео, підписників, апгрейди та машини.</p><button class="danger" onclick="resetGame()">Скинути весь прогрес</button></div>`)}function resetGame(){if(confirm('Точно скинути весь прогрес? Це незворотно.')){localStorage.removeItem(SAVE);location.reload()}}
function passiveViews(){let gain=0;state.videos.forEach(v=>{let g=Math.max(1,Math.floor(v.views*(.002+Math.random()*.006)));v.views+=g;gain+=g});if(gain){state.views+=gain;update()}}
load();let p=0;const timer=setInterval(()=>{p=Math.min(100,p+2);$('loadbar').style.width=p+'%';$('loadtxt').textContent='Завантаження '+p+'%';if(p>=100){clearInterval(timer);setTimeout(()=>{$('loading').style.display='none';$('app').style.display='block';update()},250)}},30);setInterval(passiveViews,15000);
</script></body></html>
